<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Category</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
    :root {
      --primary: rgb(28, 48, 110);
      --secondary: rgb(0, 172, 92);
      --secondary-hover: rgb(0, 145, 75);
      --bg-light: #F8FAFC;
      --white: #FFFFFF;
      --text-dark: #1E293B;
      --text-gray: #64748B;
      --border: #D8E0EA;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { margin: 0; background: linear-gradient(180deg, #F8FAFC 0%, #EEF4FA 100%); color: var(--text-dark); }
    .page { max-width: 1240px; margin: 0 auto; padding: 56px 24px 72px; }
    .page-top { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 40px; }
    .title-wrap h1 { margin: 0 0 10px; color: var(--primary); font-size: clamp(2.1rem, 4vw, 3rem); }
    .title-wrap p { margin: 0; color: var(--text-gray); font-size: 1.02rem; }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 999px;
      background: var(--white);
      color: var(--primary);
      text-decoration: none;
      box-shadow: var(--shadow);
      font-weight: 700;
      white-space: nowrap;
    }
    .activities-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px;
    }
    .activity-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 26px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    .activity-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      background: #e5e7eb;
    }
    .activity-body {
      padding: 22px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
      text-align: center;
    }
    .activity-body h3 {
      margin: 0;
      color: var(--primary);
      font-size: 1.6rem;
      font-weight: 700;
    }
    .activity-body p {
      margin: 0;
      color: var(--text-gray);
      line-height: 1.75;
      flex: 1;
      font-size: 1rem;
    }
    .activity-actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      border: none;
      cursor: pointer;
      flex: 1;
      transition: 0.25s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--secondary); color: var(--white); }
    .btn-primary:hover { background: var(--secondary-hover); }
    .btn-secondary { background: rgba(28, 48, 110, 0.08); color: var(--primary); }
    .empty-state {
      text-align: center;
      padding: 90px 24px;
      color: var(--text-gray);
      background: var(--white);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }
    @media (max-width: 1024px) {
      .activities-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 700px) {
      .page { padding: 36px 16px 56px; }
      .page-top { flex-direction: column; align-items: flex-start; margin-bottom: 28px; }
      .activities-grid { grid-template-columns: 1fr; }
      .activity-card img { height: 220px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-top">
      <div class="title-wrap">
        <h1 id="categoryTitle">Activities</h1>
        <p id="categorySubtitle">Explore activities in this category.</p>
      </div>
      <a class="back-link" href="./index.html#activity"><i class="fa-solid fa-arrow-left"></i> Back to Categories</a>
    </div>
    <div id="categoryActivities" class="activities-grid"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/activity-category.js"></script>
</body>
</html>
