<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg,#1c306e,#00ac5c);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .container{
      width: 400px;
      background:#fff;
      padding:30px;
      border-radius:15px;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    h2{
      text-align:center;
      margin-bottom:20px;
      color:#1c306e;
    }

    .input-box{
      margin-bottom:15px;
    }

    input{
      width:100%;
      padding:12px;
      border:1px solid #ddd;
      border-radius:10px;
      box-sizing:border-box;
      outline:none;
      transition:0.3s;
    }

    input:focus{
      border-color:#00ac5c;
      box-shadow:0 0 5px rgba(0,172,92,0.3);
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#00ac5c;
      color:#fff;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#008f4c;
    }

    .footer{
      text-align:center;
      margin-top:15px;
      font-size:14px;
    }

    .footer a{
      color:#1c306e;
      text-decoration:none;
      font-weight:bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Create Account</h2>

    <form id="signupForm">
      <div class="input-box">
        <input type="text" id="firstName" placeholder="First Name" required />
      </div>

      <div class="input-box">
        <input type="text" id="lastName" placeholder="Last Name" required />
      </div>

      <div class="input-box">
        <input type="email" id="email" placeholder="Email" required />
      </div>

      <div class="input-box">
        <input type="password" id="password" placeholder="Password" required />
      </div>

      <div class="input-box">
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
      </div>

      <button type="submit">Sign Up</button>
    </form>

    <div class="footer">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>

  <script>
    const BASE_URL_SIGNUP =
    "https://mystudentactivity.runasp.net";

    document.getElementById("signupForm").addEventListener("submit", async function(e){
      e.preventDefault();

      const firstName = document.getElementById("firstName").value.trim();
      const lastName = document.getElementById("lastName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();
      if(!firstName || !lastName || !email || !password || !confirmPassword){
        alert("Please fill all fields");
        return;
      }

      if(password.length < 6){
        alert("Password must be at least 6 characters");
        return;
      }

      if(password !== confirmPassword){
        alert("Passwords do not match");
        return;
      }

      try {
        const res = await fetch(BASE_URL_SIGNUP + '/api/Auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ firstName, lastName, email, password })
        });

        const text = await res.text();
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch(_) { data = text; }

        if (!res.ok) {
          const msg = (data && (data.message || data.title || JSON.stringify(data))) || res.statusText;
          throw new Error(msg);
        }

        console.log('Register response:', data);
        localStorage.setItem('must_pending_email', email);
        alert("Account created successfully. Enter the OTP code sent to your email.");
        window.location.href = 'verify-otp.html';

      } catch(err) {
        console.error('Register error:', err);
        alert("Registration failed: " + err.message);
      }
    });
  </script>

</body>
</html>
